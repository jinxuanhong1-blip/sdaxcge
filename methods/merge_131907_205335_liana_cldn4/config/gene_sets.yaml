# Focus-axis labels for merged GSE131907+GSE205335 CLDN4-high malignant → T/NK.
# These annotate the CellPhoneDB v5 pair list; they do not subset the score.

state_genes: [CLDN4, TACSTD2]

pathways:
  T_recruit:
    ligands: [CXCL9, CXCL10, CXCL11, CCL5, CCL3, CCL4, CXCL16, CCL19, CCL21, CXCL13, CX3CL1, CXCL12]
    receptors: [CXCR3, CCR5, CCR1, CXCR6, CCR7, CXCR5, CX3CR1, CXCR4]
  IFN:
    ligands: [IFNG, IFNA1, IFNA2, IFNB1, IFNL1, IFNL2, IFNL3]
    receptors: [IFNGR1, IFNGR2, IFNAR1, IFNAR2, IFNLR1, IL10RB]
  MHC_I:
    ligands: [HLA-A, HLA-B, HLA-C, HLA-E, HLA-F, HLA-G, B2M]
    receptors: [CD8A, CD8B, KIR3DL1, KIR3DL2, KIR2DL1, KIR2DL3, KIR2DL4, KLRC1, KLRC2, KLRC3, KLRD1, LILRB1, LILRB2, KLRK1]

params:
  expr_prop: 0.10
  min_malig_per_state: 10
  min_tnk: 20
  high_rule: median
  liana_max_cells_per_group: 2000
  liana_n_perms: 50
  random_seed: 0
