# Pre-specified. Do not retune after seeing results.
question: >
  Which TF regulons are recovered from CLDN4-high malignant-like cells
  on public GSE207422 (Hu et al. 2023)? Additive to methods/scrna_scenic
  (ELF3/GRHL1/KLF4 AUCell vs TACSTD2/CLDN4). This folder infers regulons
  in CLDN4-high cells only. ELF3–CLDN4 bulk RNA (A10) is taken as given
  and is not re-tested as a discovery.

dataset:
  accession: GSE207422
  pmid: 36869384
  doi: 10.1186/s13073-023-01164-9
  why: public processed UMI (175 MB gzip), Adeno+Squamous, same matrix as scrna_scenic
  not_used:
    GSE253013: 9.3 GB RDS; not required
    GSE131907: multi-GB; no ICI; not required
  copykat: author malignant labels are NOT on GEO; malignant-like is a marker proxy

a10_taken_as_given: ELF3_CLDN4_bulk_RNA

cldn4_high:
  primary: within-sample median of CLDN4 log1p(CP10k) among malignant-like cells
  min_malignant_per_sample: 20
  sensitivity: global median among all malignant-like cells
  hold_out_from_regulons: [CLDN4]

focus_tfs: [ELF3, GRHL1, GRHL2, KLF4, KLF5, OVOL1, OVOL2, TFAP2A, SP1, TP63]
# ELF3 is given (A10). Others are barrier / TJ-adjacent TFs, not a binding claim.
control_tfs: [NKX2-1, SOX2, FOXA1]

grn:
  method: lightweight proxy
  layers:
    - public priors (TRRUST v2 + DoRothEA + CollecTRI); not ChIP
    - Pearson co-expression in CLDN4-high malignant-like cells only
    - high-specific = r_high >= 0.15 and r_low < 0.10
  not_run: [pySCENIC_cisTarget, GRNBoost2_default, invented_ChIP]
  pearson_top_n: 50
  pearson_min_r: 0.10
  auc_threshold: 0.05

qc:
  min_umi: 200
  malignant_normal_lung_quantile: 0.75
  min_cells_per_sample: 20
  min_samples_for_paired: 6
  hvg_n: 4000
  min_detection: 0.02
  tf_min_detection_high: 0.05

primary_output: CLDN4-high regulon table (not CLDN4-low regulons)
primary_unit: sample (paired high vs low AUCell of public priors)
cell_level: exploratory only (pseudoreplication)

verdict_rules:
  this_folder_is: descriptive regulon table + prior-AUCell high vs low
  elf3_cldn4: given; do not call SUPPORT from rediscovering ELF3 RNA
  underpowered: n_samples < 6
