# Methods-only pins for methods/tcr templates.
# Create: conda env create -f methods/tcr/env/environment.yml
name: tcr-playbook
channels:
  - conda-forge
dependencies:
  - python>=3.11,<3.13
  - pip
  - r-base>=4.2
  - pip:
      - "scirpy>=0.25,<0.26"
      - "scanpy>=1.10"
      - "anndata>=0.10"
      - "mudata>=0.3"
      - "pandas>=2.0"
      - "scipy>=1.11"
      - "pyyaml>=6.0"
